<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="__CONTENT_SECURITY_POLICY__">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000080">
    <meta name="description" content="Gavin 的荣誉奖状：数学建模、机器人竞赛与学业成果。">
    <title>荣誉奖状 | GAVIN OS</title>
    <link rel="canonical" href="https://lizuju.github.io/honors/">
    <link rel="icon" type="image/png" href="../portfolio/assets/avatar.png">
    <link rel="stylesheet" href="../portfolio/css/honors.css?v=__ASSET_VERSION__">
</head>
<body class="standalone-honors" data-asset-root="../portfolio/">
    <main class="retro-desktop" data-retro-desktop>
        __PROJECT_WINDOWS__
        <button type="button" data-start-toggle aria-expanded="false" hidden></button>
        <div data-start-menu hidden></div>
        <footer class="desktop-taskbar">
            <div class="taskbar-tasks">
                <button class="task-window-button honors-task-button" type="button" data-project-folder-task disabled>
                    <span class="window-app-icon window-app-icon--folder" aria-hidden="true"></span>
                    <span data-i18n="folderHonors">荣誉奖状</span>
                </button>
                <button class="task-window-button image-preview-task-button" type="button" data-image-preview-task hidden>
                    <span class="window-app-icon window-app-icon--image" aria-hidden="true"></span>
                    <span data-image-preview-task-title data-i18n="previewTaskTitle">图片预览</span>
                </button>
                <button class="task-window-button" type="button" data-video-preview-task hidden>
                    <span data-i18n="videoTaskTitle">视频播放器</span>
                </button>
                <button class="task-window-button" type="button" data-paper-preview-task hidden>
                    <span data-paper-preview-task-title data-i18n="paperPreviewTitle">论文预览</span>
                </button>
            </div>
            <div class="taskbar-spacer"></div>
            <div class="taskbar-tray">
                <button class="taskbar-language-toggle" type="button" data-taskbar-lang
                    aria-label="切换为英文" title="切换为英文">EN</button>
            </div>
        </footer>
    </main>
    <script src="../portfolio/js/content.js?v=__ASSET_VERSION__"></script>
    <script src="../portfolio/js/honors.js?v=__ASSET_VERSION__"></script>
</body>
</html>
