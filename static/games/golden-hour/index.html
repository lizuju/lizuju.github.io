<script>
(() => {
  // Computer only: the game needs a keyboard and mouse, so phones get a notice instead.
  const ua = navigator.userAgent || '';
  const coarseOnly = matchMedia('(any-pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
  const phone = Boolean(navigator.userAgentData?.mobile) || /Android|iPhone|iPod|Windows Phone|Mobile/i.test(ua) || coarseOnly;
  window.__goldenHourPhone = phone;
  if (phone) document.documentElement.classList.add('gh-phone');

  // GavinOS bridge. Inside the desktop window this page is sandboxed: its own process and no
  // storage of its own. The desktop sends one state message (minimized, drawing hold, mute and the
  // saved settings) and keeps the settings this page saves.
  const embedded = window.parent !== window;
  let muted = false;
  let hold = false;
  let hostHidden = false;
  let hidden = document.hidden;
  const bootWaiters = new Set();
  window.__goldenHourWaitForBoot = async (task) => {
    while (hidden || hold) await new Promise((resolve) => bootWaiters.add(resolve));
    return task?.();
  };
  let resolveReady;
  window.__goldenHourReady = new Promise((resolve) => { resolveReady = resolve; });

  let ownStorage = true;
  try { window.localStorage.getItem('golden-hour-settings-v1'); } catch { ownStorage = false; }
  const saved = new Map();
  let savedLoaded = false;
  if (!ownStorage) {
    const save = () => window.parent.postMessage({ source: 'golden-hour', type: 'storage', value: Object.fromEntries(saved) }, '*');
    const storage = {
      get length() { return saved.size; },
      key: (index) => [...saved.keys()][index] ?? null,
      getItem: (key) => (saved.has(String(key)) ? saved.get(String(key)) : null),
      setItem: (key, value) => { saved.set(String(key), String(value)); save(); },
      removeItem: (key) => { saved.delete(String(key)); save(); },
      clear: () => { saved.clear(); save(); }
    };
    try { Object.defineProperty(window, 'localStorage', { configurable: true, get: () => storage }); } catch {}
  }

  // Mute: everything the game sends to the speakers passes one gain node per audio context.
  const outputs = new Map();
  const connect = typeof AudioNode === 'undefined' ? null : AudioNode.prototype.connect;
  const disconnect = typeof AudioNode === 'undefined' ? null : AudioNode.prototype.disconnect;
  const updateOutput = (output, state) => {
    const context = output.context;
    output.hidden = hidden;
    output.muted = muted;
    if (context.state === 'closed') {
      outputs.delete(output);
      return;
    }
    // Keep the audio clock and sustained sounds current without an audible DSP output.
    if (state.connected === muted) {
      if (muted) disconnect.call(output);
      else connect.call(output, state.destination);
      state.connected = !muted;
    }
    output.gain.setTargetAtTime(muted || hidden ? 0 : 1, context.currentTime, 0.02);
    if (state.pending) return;
    const suspend = hidden && context.state === 'running';
    const resume = !hidden && state.suspended && context.state === 'suspended';
    if (!suspend && !resume) return;
    state.pending = true;
    if (suspend) state.suspended = true;
    (suspend ? context.suspend() : context.resume()).then(() => {
      state.pending = false;
      if (resume) state.suspended = false;
      updateOutput(output, state);
    }, () => {
      state.pending = false;
      if (suspend) state.suspended = false;
    });
  };
  const applyMute = () => {
    for (const [output, state] of outputs) updateOutput(output, state);
  };
  if (typeof AudioNode !== 'undefined' && typeof AudioDestinationNode !== 'undefined') {
    const outputFor = (destination) => {
      const context = destination.context;
      if (!context.__goldenHourOutput) {
        const output = context.createGain();
        output.gain.value = muted || hidden ? 0 : 1;
        context.__goldenHourOutput = output;
        const state = { suspended: false, pending: false, connected: false, destination };
        outputs.set(output, state);
        context.addEventListener('statechange', () => updateOutput(output, state));
        updateOutput(output, state);
      }
      return context.__goldenHourOutput;
    };
    AudioNode.prototype.connect = function (target, ...rest) {
      return connect.call(this, target instanceof AudioDestinationNode ? outputFor(target) : target, ...rest);
    };
    AudioNode.prototype.disconnect = function (...args) {
      if (args[0] instanceof AudioDestinationNode) args[0] = outputFor(args[0]);
      return disconnect.apply(this, args);
    };
  }

  // Keep simulation at its normal pace while reducing only draws behind another window,
  // during dragging or off-camera. Minimized games stop their callbacks entirely.
  const nativeFrame = window.requestAnimationFrame.bind(window);
  const nativeCancel = window.cancelAnimationFrame.bind(window);
  const waiting = new Map();
  let nextId = 1;
  let decidedAt = -1;
  let runThisFrame = true;
  let nextRun = -Infinity;
  let frameInterval = 0;
  let nextDraw = -Infinity;
  window.__goldenHourClockEpoch = 0;
  window.__goldenHourShouldRender = (time) => {
    if (hidden) return false;
    if (!hold) return true;
    if (time - nextDraw > 400) nextDraw = time;
    if (time + 0.001 < nextDraw) return false;
    nextDraw = Math.max(nextDraw + 200, time);
    return true;
  };
  const allowFrame = (time) => {
    if (time !== decidedAt) {
      const state = window.GH?.G?.state || 'playing';
      const interval = hidden ? Infinity : ['menu', 'paused', 'over'].includes(state) ? 1000 / 30 : 1000 / 60;
      if (interval !== frameInterval || time - decidedAt > interval * 2) {
        frameInterval = interval;
        nextRun = time;
      }
      decidedAt = time;
      runThisFrame = time + 0.001 >= nextRun;
      // Keep refresh jitter from moving the cadence, without accumulating work during slow frames.
      if (runThisFrame) nextRun = Math.max(nextRun + interval, time);
    }
    return runThisFrame;
  };
  window.requestAnimationFrame = (callback) => {
    const id = nextId++;
    const entry = { nativeId: null, tick: null };
    const tick = (time) => {
      if (!waiting.has(id)) return;
      entry.nativeId = null;
      if (hidden) return;
      if (allowFrame(time)) {
        waiting.delete(id);
        callback(time);
      } else {
        entry.nativeId = nativeFrame(tick);
      }
    };
    entry.tick = tick;
    waiting.set(id, entry);
    if (!hidden) entry.nativeId = nativeFrame(tick);
    return id;
  };
  window.cancelAnimationFrame = (id) => {
    const entry = waiting.get(id);
    if (entry && entry.nativeId !== null) nativeCancel(entry.nativeId);
    waiting.delete(id);
  };
  const applyVisibility = () => {
    const nextHidden = hostHidden || document.hidden;
    if (hidden !== nextHidden) {
      hidden = nextHidden;
      nextRun = -Infinity;
      nextDraw = -Infinity;
      frameInterval = 0;
      decidedAt = -1;
      if (!hidden) window.__goldenHourClockEpoch++;
      for (const entry of waiting.values()) {
        if (hidden) {
          if (entry.nativeId !== null) nativeCancel(entry.nativeId);
          entry.nativeId = null;
        } else if (entry.nativeId === null) {
          entry.nativeId = nativeFrame(entry.tick);
        }
      }
    }
    applyMute();
    if (!hidden && !hold) {
      for (const resolve of bootWaiters) resolve();
      bootWaiters.clear();
    }
  };
  document.addEventListener('visibilitychange', applyVisibility);

  if (!embedded) {
    resolveReady();
    return;
  }
  addEventListener('message', (event) => {
    const state = event.data;
    if (event.source !== window.parent || state?.source !== 'gavin-desktop' || state.type !== 'game-state') return;
    muted = Boolean(state.muted);
    const nextHold = Boolean(state.hold);
    if (hold !== nextHold) nextDraw = -Infinity;
    hold = nextHold;
    hostHidden = Boolean(state.hidden);
    // The desktop's taskbar 中/EN button sets the game's interface language too.
    if (typeof state.lang === 'string') window.GoldenHourI18n?.setLanguage(state.lang);
    if (!ownStorage && !savedLoaded && state.storage && typeof state.storage === 'object') {
      for (const [key, value] of Object.entries(state.storage)) if (typeof value === 'string') saved.set(key, value);
      savedLoaded = true;
    }
    applyVisibility();
    resolveReady();
  });
  window.parent.postMessage({ source: 'golden-hour', type: 'ready' }, '*');
  // A desktop that never answers only costs the saved settings, not the game.
  setTimeout(resolveReady, 1500);
})();
</script>

<title>GOLDEN HOUR — Solstice Hotel</title>
<style>
  /* 1rem = 10 design px at 1080p. Everything scales with the window; nothing is authored in px. */
  :root { --or: #ff8a2a; --or2: #ffb35c; --fr: #6fdcff; --en: #ff5a36; --good: #7fe08f; --bad: #ff6a4d; --ink: rgba(10, 8, 7, .66); --line: rgba(255, 255, 255, .14);

  button { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
  .key, kbd { font-family: inherit; display: inline-flex; align-items: center; justify-content: center; min-width: 2.1em; height: 1.75em; padding: 0 .5em; font-size: var(--f1); font-weight: 600; letter-spacing: .06em; line-height: 1;
    color: #fff; background: linear-gradient(#2a2622, #15120f); border: 1px solid rgba(255, 255, 255, .42); border-bottom-width: .2rem; border-radius: .3rem; text-shadow: none; vertical-align: middle; }

  #cross .l { height: var(--tw); width: var(--tl); top: calc(var(--tw) / -2); right: 0; } #cross .r { height: var(--tw); width: var(--tl); top: calc(var(--tw) / -2); left: 0; }
  #cross u { position: absolute; width: var(--tw); height: var(--tw); left: calc(var(--tw) / -2); top: calc(var(--tw) / -2); background: var(--xc); box-shadow: 0 0 0 1px rgba(0, 0, 0, .55); }

  #cross.x-smg { --tl: .8rem; } #cross.x-pistol { --tl: .7rem; }
  #cross.x-shotgun { --tl: .6rem; } #cross.x-shotgun svg { display: block; } #cross.x-shotgun u { display: none; }

  .hm { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; will-change: transform, opacity; }

  /* --- ammo cue under the crosshair --- */

  #cue.on { opacity: 1; } #cue.low { color: #ffd68a; } #cue.reload { color: #fff; animation: cuep .7s ease-in-out infinite alternate; } #cue.empty { color: #ff7a5c; }

  #score .tm { display: flex; align-items: center; gap: 1rem; min-width: 21rem; position: relative; padding-bottom: .9rem; opacity: .86; transition: opacity .3s; }
  #score .tm.a { justify-content: flex-end; } #score .tm.lead { opacity: 1; }
