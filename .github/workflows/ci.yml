name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare/sync
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cloudflare/sync/package-lock.json
      - name: Install sync dependencies
        run: npm ci
      - name: Audit sync dependencies
        run: npm audit --audit-level=moderate
      - name: Install client encryption dependencies
        run: npm ci --prefix ../..
      - name: Validate sync worker
        run: npm run check
      - name: Test pairing and realtime sync
        run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      playwright-version: ${{ steps.browser-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read installed browser version
        id: browser-version
        run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Validate browser shard allocation
        run: node --test scripts/browser-shards.test.cjs

      - name: Find the latest measured browser timings
        if: github.event_name == 'pull_request'
        continue-on-error: true
        id: timings
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listArtifactsForRepo({
              ...context.repo, name: 'browser-duration-baseline', per_page: 10
            });
            const latest = data.artifacts.find(artifact => !artifact.expired && artifact.workflow_run);
            core.setOutput('run-id', latest?.workflow_run.id || '');

      - name: Restore measured browser timings
        if: steps.timings.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: browser-duration-baseline
          run-id: ${{ steps.timings.outputs.run-id }}
          github-token: ${{ github.token }}
          path: output/

      - name: Prepare one timing baseline for all shards
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p output
          node -e "require('fs').writeFileSync('output/browser-test-durations.json', JSON.stringify(require('./scripts/update-browser-durations.cjs').loadDurations()))"

      - name: Share the timing baseline
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: browser-timing-input
          path: output/browser-test-durations.json
          retention-days: 7

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build production site
        run: npm run build

      - name: Share production site
        uses: actions/upload-artifact@v7
        with:
          name: production-site
          path: docs/
          retention-days: 1
          compression-level: 0

  browser-tests:
    name: browser-tests (${{ matrix.project }}, ${{ matrix.shard }})
    needs: build
    # Pull requests run the browser suite on their merge result; main must be up to date before
    # merging, so pushes to main only rebuild and deploy what those checks already verified.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright-version }}-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium-desktop, browser: chromium, shard: '1/2', artifact: chromium-desktop-1 }
          - { project: chromium-desktop, browser: chromium, shard: '2/2', artifact: chromium-desktop-2 }
          - { project: webkit-desktop, browser: webkit, shard: '1/4', artifact: webkit-desktop-1 }
          - { project: webkit-desktop, browser: webkit, shard: '2/4', artifact: webkit-desktop-2 }
          - { project: webkit-desktop, browser: webkit, shard: '3/4', artifact: webkit-desktop-3 }
          - { project: webkit-desktop, browser: webkit, shard: '4/4', artifact: webkit-desktop-4 }
          - { project: chromium-mobile, browser: chromium, shard: '1/1', artifact: chromium-mobile }
          - { project: webkit-mobile, browser: webkit, shard: '1/2', artifact: webkit-mobile-1 }
          - { project: webkit-mobile, browser: webkit, shard: '2/2', artifact: webkit-mobile-2 }
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust checkout in browser container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/sync/package-lock.json

      - name: Install dependencies
        run: npm ci && npm ci --prefix cloudflare/sync

      - name: Download production site
        uses: actions/download-artifact@v8
        with:
          name: production-site
          path: docs/

      - name: Download the shared timing baseline
        uses: actions/download-artifact@v8
        with:
          name: browser-timing-input
          path: output/

      - name: Run browser regression suite
        run: node scripts/run-browser-shard.cjs ${{ matrix.project }} ${{ matrix.shard }}

      - name: Share measured browser timings
        uses: actions/upload-artifact@v7
        with:
          name: browser-timings-${{ matrix.artifact }}
          path: test-results/browser-durations.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ matrix.artifact }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-timings:
    name: Calibrate browser shard timings
    needs: browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Download the previous baseline
        uses: actions/download-artifact@v8
        with:
          name: browser-timing-input
          path: output/
      - name: Download successful shard measurements
        uses: actions/download-artifact@v8
        with:
          pattern: browser-timings-*
          path: output/browser-timing-samples/
      - name: Update timing weights
        run: node scripts/update-browser-durations.cjs output/browser-timing-samples
      - name: Save the next timing baseline
        uses: actions/upload-artifact@v7
        with:
          name: browser-duration-baseline
          path: output/browser-test-durations.json
          retention-days: 30

  deploy:
    name: Deploy verified site
    needs: [build, sync-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Require the current sync Worker sources
        run: npm run check:sync-api

      - name: Download verified production site
        uses: actions/download-artifact@v8
        with:
          name: production-site
          path: docs/

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
