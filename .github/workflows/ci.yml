name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare/sync
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cloudflare/sync/package-lock.json
      - name: Install sync dependencies
        run: npm ci
      - name: Install client encryption dependencies
        run: npm ci --prefix ../..
      - name: Validate sync worker
        run: npm run check
      - name: Test pairing and realtime sync
        run: npm test

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Build production site
        run: npm run build

      - name: Verify committed deployment output
        run: npm run verify:docs

      - name: Run browser regression suite
        run: npm ci --prefix cloudflare/sync && npm run test:smoke

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
